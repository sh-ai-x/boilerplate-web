name: Publish CLI to npm

# Publish the create-boilerplate-web CLI to npm via OIDC trusted publishing.
# Triggers:
#   - workflow_dispatch on main (manual ad-hoc release under `latest`)
#   - push of a semver tag v*.*.* (auto-release on tag push; dist-tag derived
#     from ref name: rc/beta/alpha for pre-releases, latest for stable)
#
# Auth: OIDC trusted publishing only. The job declares `id-token: write`
# and runs `npm publish --provenance --access public`; npm's OIDC token
# exchange handles authentication. No long-lived auth secret is referenced
# or required. See https://docs.npmjs.com/generating-provenance-statements
# and https://docs.npmjs.com/trusted-publishers for the publisher contract.
#
# Approval gate: the publish job runs in the `npm-publish` GitHub
# Environment, which is configured with required reviewers in repo
# settings. Tag-triggered releases still gate on the maintainer approving
# the deployment. See `phases/1-cli-distribution/step2.md` "Don't".
#
# OIDC requires the workflow to run on the canonical repo (fork PRs would
# be rejected by the npm token exchange). workflow_dispatch is restricted
# to `main` so ad-hoc publishes only fire from the canonical branch; tag
# pushes happen on the canonical repo by definition.

on:
  workflow_dispatch:
    branches: [main]
  push:
    tags: ['v*.*.*']

# Per-tag concurrency serializes publishes without interrupting an in-flight
# registry upload. A later run waits rather than racing a partial publish.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/create-boilerplate-web
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5b2b
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI bundle
        run: npm run build:cli

      - name: Run test suite
        run: pnpm test

      # Post-build smoke check: the bundle file must exist, be executable,
      # and print the CLI's --help banner. AC3 here is real (not regex-only)
      # because the contract from step 0 (bin pointing at cli/index.js or
      # step 1's bundle output) plus step 1's bundle output converge here.
      - name: Post-build smoke check
        run: |
          set -euo pipefail
          # The build:cli script bundles into the dist/ directory; the
          # exact output path is owned by step 1. Test for the canonical
          # bundle path and a CLI banner that mentions the package name.
          if [[ -x dist/cli.js ]]; then
            BIN=dist/cli.js
          elif [[ -x cli/dist/cli.js ]]; then
            BIN=cli/dist/cli.js
          else
            echo "No executable CLI bundle found (tried dist/cli.js, cli/dist/cli.js)"
            exit 1
          fi
          node "$BIN" --help | grep -q "create-boilerplate-web" || {
            echo "CLI --help did not mention 'create-boilerplate-web'"
            exit 1
          }

      - name: Derive npm dist-tag from ref
        id: dist_tag
        run: |
          set -euo pipefail
          REF="${{ github.ref_name }}"
          REF="${REF#v}"
          REF="${REF#refs/tags/}"
          if   [[ "$REF" =~ -rc\.[0-9]+$     ]]; then TAG="rc"
          elif [[ "$REF" =~ -beta\.[0-9]+$   ]]; then TAG="beta"
          elif [[ "$REF" =~ -alpha\.[0-9]+$  ]]; then TAG="alpha"
          elif [[ "$REF" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then TAG="latest"
          else TAG="latest"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Derived dist-tag '$TAG' from ref '${{ github.ref_name }}'"

      - name: Publish to npm (OIDC trusted publishing)
        env:
          NPM_CONFIG_TAG: ${{ steps.dist_tag.outputs.tag }}
        run: npm publish --provenance --access public
