name: Publish CLI to npm

# Publish the create-boilerplate-web CLI to npm via OIDC trusted publishing.
# Triggers:
#   - workflow_dispatch (manual ad-hoc release)
#   - push of a semver tag v*.*.* (auto-release on tag push)
#
# Auth: OIDC trusted publishing only. The job declares `id-token: write`
# and runs `npm publish --provenance --access public`; npm's OIDC token
# exchange handles authentication. No long-lived auth secret is referenced
# or required. See https://docs.npmjs.com/generating-provenance-statements
# and https://docs.npmjs.com/trusted-publishers for the publisher contract.
#
# OIDC requires the workflow to run on the canonical repo (fork PRs would
# be rejected by the npm token exchange). Both triggers above meet that
# constraint: workflow_dispatch is operator-initiated on main, and
# tag-pushes happen on the canonical repo.

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

# Per-tag concurrency serializes publishes without interrupting an in-flight
# registry upload. A later run waits rather than racing a partial publish.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Step 1 owns the build:cli script. Keep release attempts explicitly
      # deferred until that prerequisite lands instead of failing later.
      - name: Verify build prerequisite
        run: |
          if ! test -n "$(node -e "console.log(require('./package.json').scripts['build:cli'] || '')")"; then
            echo "build:cli not yet defined — deferring until step 1 lands"
            exit 1
          fi

      - name: Setup Node 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5b2b
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI bundle
        run: npm run build:cli

      - name: Run test suite
        run: pnpm test

      - name: Publish to npm (OIDC trusted publishing)
        env:
          # Tag pushes use the Git ref name as the npm dist-tag; manual runs
          # publish under the standard `latest` dist-tag.
          NPM_CONFIG_TAG: ${{ github.event_name == 'push' && github.ref_name || 'latest' }}
        run: npm publish --provenance --access public
