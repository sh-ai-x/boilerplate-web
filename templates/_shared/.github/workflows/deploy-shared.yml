name: deploy-shared (composite)

# Reusable composite workflow invoked by each per-template
# templates/<type>/.github/workflows/deploy.yml.
#
# Defines three jobs (vercel-deploy, cloudflare-pages-deploy, supabase-cli-bootstrap)
# that are identical across saas / shop / portfolio. Per-template-specific jobs
# (Edge Function deploy, Cloudflare WAF push) live in the calling workflow.

on:
  workflow_call:
    inputs:
      template-type:
        description: "Template type (saas | shop | portfolio)"
        type: string
        required: true
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true
      CF_API_TOKEN:
        required: false
      CF_ZONE_ID:
        required: false
      SUPABASE_ACCESS_TOKEN:
        required: true
      SUPABASE_PROJECT_REF:
        required: true

permissions:
  contents: read

jobs:
  vercel-deploy:
    name: vercel — deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '20'
      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5b2b # v4
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@16e87c0a08142b0d0d33b76aeaf20823c381b9b9 # v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          vercel-args: '--prod'

  cloudflare-pages-deploy:
    name: cloudflare-pages — direct upload
    runs-on: ubuntu-latest
    # Per-template .github/workflows/deploy.yml may not need CF Pages (operator
    # chooses Vercel OR Cloudflare Pages). Skip cleanly when secrets absent.
    if: ${{ secrets.CF_API_TOKEN != '' && secrets.CF_ZONE_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '20'
      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5b2b # v4
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (Next.js → .vercel/output/static via @cloudflare/next-on-pages)
        run: pnpm exec next-on-pages
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@df669237a4d8f43d1725c6377f25fd69c08ab1f1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ZONE_ID }}
          projectName: ${{ inputs.template-type }}
          directory: .vercel/output/static
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  supabase-cli-bootstrap:
    name: supabase-cli — install (auth done in caller)
    runs-on: ubuntu-latest
    steps:
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@aa3515eac405eac768fa4a72147c22d88a283c7b
        with:
          version: latest
