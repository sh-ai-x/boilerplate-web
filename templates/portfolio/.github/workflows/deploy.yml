name: deploy (portfolio)

# Per-template deploy workflow for the portfolio boilerplate.
# Portfolio has NO Edge Functions (no payment surface) and NO Cloudflare WAF
# (no payment surface, no bot-protection needs — per PRD non-goal #2).
# Only the Next.js deploy via the shared composite fires.

on:
  push:
    branches: [main]
    paths:
      - 'templates/portfolio/**'
  workflow_dispatch:

concurrency:
  group: deploy-portfolio-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-shared:
    name: shared — Vercel + Cloudflare Pages
    uses: ./_shared/.github/workflows/deploy-shared.yml
    with:
      template-type: portfolio
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
